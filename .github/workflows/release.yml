name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: deploy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [ armv7-unknown-linux-gnueabihf ]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          # package-build derives version.txt from `git describe --exact-match --tags`,
          # so the tag has to be present in the checkout.
          fetch-depth: 0

      - name: Setup build toolchain
        uses: ./.github/actions/setup-build

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build target
        run: cargo zigbuild --release --bins --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          make all
          echo "Version: $(cat dist/.allium/version.txt)"
          cd dist
          zip -r ../allium-${{ matrix.target }}.zip .allium .tmp_update RetroArch Apps BIOS Roms Saves Themes
          cd -
          ls -lh allium-${{ matrix.target }}.zip

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: 'allium-${{ matrix.target }}.zip'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
